apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace "com.zaf.triviapp"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.zaf.triviapp"
        minSdkVersion 27
        targetSdkVersion 35
        versionCode 6
        versionName "1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        config {
            keyAlias "key0"
            keyPassword "123android"
            storeFile file("keystore.jks")
            storePassword "123android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.config
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(":triviapp")

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Firebase Auth
    implementation 'com.google.firebase:firebase-auth:23.2.0'

    implementation 'com.firebaseui:firebase-ui-auth:8.0.2'
    implementation 'com.google.firebase:firebase-database:21.0.0'

    // Firebase SDK for Google Analytics.
    implementation 'com.google.firebase:firebase-analytics:22.3.0'

    // Firebase SDK for Crashlytics.
    implementation 'com.google.firebase:firebase-crashlytics:19.4.1'

    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    // Dynamic Toasts
    implementation 'com.pranavpandey.android:dynamic-toasts:1.3.0'

    // picasso & okhttp3
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.jakewharton.picasso:picasso2-okhttp3-downloader:1.1.0'

    // retrofit & gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // MPAndroidChart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // nice-spinner
//    implementation 'lib.kingja.switchbutton:switchbutton:1.1.8'

    // Fancy gif dialog
    implementation 'com.github.Shashank02051997:FancyGifDialog-Android:1.2'

    // Particles effect/confetti effect
//    implementation 'com.plattysoft.leonids:LeonidsLib:1.3.2'
    implementation 'nl.dionsegijn:konfetti-xml:2.0.2'

    // Recycler-View animation
//    implementation "com.mlsdev.animatedrv:library:2.0.0"
    implementation "jp.wasabeef:recyclerview-animators:4.0.2"

    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Easy native dialog
    implementation 'com.github.Haegon:EasyNativeDialog-for-Android:0.3.0'

    // Settings fragment
    implementation 'androidx.preference:preference:1.2.1'

    // ButterKnife
//    implementation 'com.jakewharton:butterknife:10.0.0'
//    annotationProcessor 'com.jakewharton:butterknife-compiler:10.0.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ViewModel and LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
//    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.8.7'

    // Debug tool to view SQLite in browser: DEVICE_IP:8080/#
    debugImplementation 'com.github.amitshekhariitbhu:Android-Debug-Database:1.0.6'


    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Adds
    implementation 'com.google.android.gms:play-services-ads-lite:24.0.0'


}

apply plugin: 'com.google.gms.google-services'
